<title>__NAME__ Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: a Figma-like workspace. A left rail lists pages; the stage is an infinite pan/zoom canvas of
   real app states; a side panel inspects one frame. Chrome stays neutral so the app's own
   and yellow are the only saturated colour on the page. */
:root{
  --ws:#e6e6ea; --panel:#ffffff; --panel-2:#f3f3f6; --ink:#17171c; --muted:#62626d; --line:#cfcfd6;
  --accent:#5b3df0; --accent-ink:#ffffff; --ok:#0a7a3d; --warn:#9a5b00;
  --shadow:0 1px 2px rgba(20,20,30,.18),0 8px 24px rgba(20,20,30,.14);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ws:#131316; --panel:#1d1d22; --panel-2:#26262d; --ink:#f0f0f4; --muted:#a0a0ab; --line:#33333b;
    --accent:#8f7bff; --accent-ink:#0f0b2b; --ok:#5fd18a; --warn:#f0b25c;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ws:#131316; --panel:#1d1d22; --panel-2:#26262d; --ink:#f0f0f4; --muted:#a0a0ab; --line:#33333b;
  --accent:#8f7bff; --accent-ink:#0f0b2b; --ok:#5fd18a; --warn:#f0b25c;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ws);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"],button.on{background:var(--ink);color:var(--ws);border-color:var(--ink)}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* top bar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:8px;align-items:baseline;margin-right:auto;min-width:0}
.brand b{font-size:15px;font-weight:600;white-space:nowrap}
.brand span{color:var(--muted);font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex}.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:7px 0 0 7px;margin-left:0}.seg button:last-child{border-radius:0 7px 7px 0}
.zoom{display:inline-flex;align-items:center;gap:4px}
.zoom output{min-width:46px;text-align:center;font:12px var(--mono)}
input[type=search]{font:inherit;color:inherit;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-height:34px;width:190px}
#railToggle{display:none}
.hint{color:var(--muted);font-size:12px;max-width:34ch;line-height:1.3}
@media (max-width:1100px){.hint{display:none}}

/* workspace */
.shell{display:grid;grid-template-columns:210px 1fr;min-height:0;position:relative}
.rail{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 24px}
.rail h3{margin:14px 8px 4px;font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rail a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;color:inherit;text-decoration:none;cursor:pointer}
.rail a:hover{background:var(--panel-2)}
.rail a.on{background:var(--ink);color:var(--ws)}
.rail a small{font:11px var(--mono);opacity:.7}
.stage{position:relative;overflow:hidden;touch-action:none;cursor:grab;min-width:0}
.stage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.sec{position:absolute}
.sec > h2{position:absolute;left:0;top:-58px;margin:0;font:600 30px/1.1 var(--sans);white-space:nowrap}
.sec > h2 small{font:400 15px var(--mono);color:var(--muted);margin-left:12px}
.sec > p.lede{position:absolute;left:0;top:-24px;margin:0;color:var(--muted);font-size:14px;white-space:nowrap}
.fr{position:absolute}
.fr .cap{position:absolute;left:0;bottom:100%;margin-bottom:8px;width:100%;display:flex;justify-content:space-between;gap:10px;font-size:13px;white-space:nowrap;overflow:hidden}
.fr .cap b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.fr .cap span{font:12px var(--mono);color:var(--muted)}
.fr .box{position:relative;width:100%;height:100%;background:var(--frame-bg);outline:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;border-radius:2px}
.fr .box .frame-host,.fr .box img,.fr .box video{transform-origin:0 0;max-width:none}
.fr .box.ph::after{content:attr(data-label);position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#d8d0ff;font:600 28px var(--sans);opacity:.55}
.fr.dim{opacity:.18}
.fr.sel .box{outline:3px solid var(--accent)}
.fr .scrolls{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font:11px var(--mono);padding:3px 7px;border-radius:99px;pointer-events:none}
.fr .cap .insp{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;min-height:0;padding:0 7px;font-size:13px;line-height:20px;cursor:pointer}

.panel .hb{display:flex;gap:6px;flex:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);max-width:min(560px,92vw);background:var(--ink);color:var(--ws);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#a12a1d;color:#fff}
#cdlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:60}
#cdlg .card{background:var(--panel);color:var(--ink);padding:16px;border-radius:10px;width:min(620px,92vw);box-shadow:var(--shadow)}
#cdlg h3{margin:0 0 6px}#cdlg p{margin:0 0 10px;color:var(--muted);font-size:13px}
#cdlg textarea{width:100%;height:240px;font:11px var(--mono);background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
#cdlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
/* inspector */
.panel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr auto;z-index:5}
.panel[hidden]{display:none}
.panel header{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel h2{margin:0;font-size:16px;line-height:1.25}
.panel header small{display:block;color:var(--muted);font:12px var(--mono);margin-top:3px}
.panel .body{overflow:auto;padding:12px 14px}
.panel .view{background:var(--frame-bg);border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:62vh}
.panel .view .frame-host,.panel .view img,.panel .view video{transform-origin:0 0;max-width:none}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:14px 0 0;font-size:13px}
.panel dt{color:var(--muted)}.panel dd{margin:0;word-break:break-word}
.panel dd code{font:12px var(--mono);background:var(--panel-2);padding:1px 5px;border-radius:4px}
.panel footer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.panel footer button{flex:1}

/* flows */
.flow-node{position:absolute}
.flow-node .box{position:relative;width:100%;height:100%;overflow:hidden;background:var(--frame-bg);outline:1px solid var(--line);box-shadow:var(--shadow);border-radius:3px}
.flow-node .box .frame-host,.flow-node .box img,.flow-node .box video{transform-origin:0 0;pointer-events:none;max-width:none}
.flow-node .cap{position:absolute;left:0;top:100%;margin-top:6px;font-size:12px;font-weight:600;width:100%}
.flow-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.flow-svg path{fill:none;stroke:var(--muted);stroke-width:2}
.flow-svg text{font:12px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--ws);stroke-width:5px;stroke-linejoin:round}

/* gallery (phones / list view) */
.gallery{position:absolute;inset:0 0 0 210px;overflow:auto;padding:12px 16px 40px;display:none}
.gallery section{margin:22px 0 8px}
.gallery h2{font-size:18px;margin:0 0 2px}.gallery p{margin:0 0 10px;color:var(--muted)}
.strip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;align-items:flex-start}
.strip .gf{flex:none;cursor:pointer}
.strip .gf .box{position:relative;overflow:hidden;background:var(--frame-bg);outline:1px solid var(--line);border-radius:3px}
.strip .gf .box .frame-host,.strip .gf .box img,.strip .gf .box video{transform-origin:0 0;pointer-events:none;max-width:none}
.strip .gf .t{margin-top:6px;font-weight:600;font-size:12px;max-width:100%}
body.gal .gallery{display:block}body.gal .stage{display:none}
.notice{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;background:var(--ink);color:var(--ws);padding:9px 14px;border-radius:8px;max-width:min(560px,92%);font-size:13px;box-shadow:var(--shadow)}

@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .gallery{inset:0}
  .rail{position:absolute;z-index:6;left:0;top:0;bottom:0;width:230px;transform:translateX(-100%);transition:transform .18s}
  body.rail-open .rail{transform:none;box-shadow:var(--shadow)}
  #railToggle{display:inline-flex}
  input[type=search]{width:120px}
  .brand span{display:none}
  .panel{width:100%;top:auto;height:78%;border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="app">
  <header class="bar">
    <button id="railToggle" aria-label="Pages">☰</button>
    <div class="brand"><b>__NAME__ Atlas</b><span id="meta"></span></div>
    <span class="hint" id="hint">Hover or click inside any state: hover and focus styles are live.</span>
    <input type="search" id="q" placeholder="Filter states" aria-label="Filter states">
    <div class="seg" role="group" aria-label="View">
      <button id="vCanvas" aria-pressed="true">Canvas</button><button id="vGallery" aria-pressed="false">Gallery</button>
    </div>
    <div class="zoom" id="zoomBox"><button id="zOut" aria-label="Zoom out">−</button><output id="zVal">100%</output><button id="zIn" aria-label="Zoom in">+</button><button id="zFit">Fit</button></div>
  </header>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Pages"></nav>
    <main class="stage" id="stage" tabindex="0" aria-label="Canvas of app states. Drag to pan, Ctrl or ⌘ plus scroll to zoom."><div class="world" id="world"></div></main>
    <div class="gallery" id="gallery"></div>
    <aside class="panel" id="panel" hidden aria-label="State details"></aside>
  </div>
</div>

<script>
/*__DATA__*/
</script>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const svgEl = (t, a = {}) => { const e = document.createElementNS("http://www.w3.org/2000/svg", t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const el = (t, a = {}, h = "") => { const e = document.createElement(t); for (const k in a) e.setAttribute(k, a[k]); if (h) e.innerHTML = h; return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const { FRAMES, PAGES, FLOWS, CSS, ASSETS, META } = ATLAS;
document.documentElement.style.setProperty("--frame-bg", META.frameBg || "#fff");
const byId = new Map(FRAMES.map(f => [f.id, f]));
$("#meta").textContent = META.label;

/* ---------- one frame = the app's real markup in a shadow root, styled by the app's real CSS ----------
   No iframe (viewers may block them): the stylesheet was flattened for the frame's size at build time, so
   hover, focus and every state style work live, text stays vector at any zoom, and nothing here runs app code. */
const VPH = { m: 844, d: 800, k: 800 };
const sheets = {};
function sheet(name, text) { if (!sheets[name]) { const s = new CSSStyleSheet(); s.replaceSync(text); sheets[name] = s; } return sheets[name]; }
const HOSTCSS = ":host{display:block;position:relative;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;contain:layout paint style;background:var(--frame-bg)}.fbody{min-height:100%}";
function mountFrame(host, f, scale, w, h) {
  if (f.kind === "img") {
    const img = document.createElement("img");
    img.alt = f.title; img.src = f.src; img.draggable = false;
    img.style.cssText = `display:block;max-width:none;width:${w}px;height:${h}px;transform-origin:0 0;${scale !== 1 ? `transform:scale(${scale})` : ""}`;
    host.appendChild(img);
    return img;
  }
  if (f.kind === "video") {
    const v = document.createElement("video");
    v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.setAttribute("aria-label", f.title);
    if (f.poster) v.poster = f.poster;
    v.src = f.src;
    v.style.cssText = `display:block;max-width:none;width:${w}px;height:${h}px;transform-origin:0 0;${scale !== 1 ? `transform:scale(${scale})` : ""}`;
    host.appendChild(v);
    v.play().catch(() => {});
    return v;
  }
  const el0 = document.createElement("div");
  el0.className = "frame-host";
  el0.style.cssText = `width:${w}px;height:${h}px;transform-origin:0 0;--fvw:${f.width}px;--fvh:${VPH[f.vp] || 844}px;${scale !== 1 ? `transform:scale(${scale});` : ""}`;
  const root = el0.attachShadow({ mode: "open" });
  const fill = t => t.replace(/⟦(A\d+)⟧/g, (m, k) => ASSETS[k] || m);
  const cssKey = f.cssId + ":" + f.vp;
  const body = fill(f.body);
  let styleTags = "";
  try { root.adoptedStyleSheets = [sheet(cssKey, fill(CSS[cssKey] || "")), sheet("host", HOSTCSS)]; }
  catch (e) { styleTags = `<style>${fill(CSS[cssKey] || "")}</style><style>${HOSTCSS}</style>`; } // older browsers: no shared sheets
  root.innerHTML = `${styleTags}<div class="fbody ${esc(f.bodyClass)}" lang="${META.lang || "en"}">${body}</div>`;
  // Static markup: links and forms must not navigate the page around it.
  el0.addEventListener("click", e => { if (e.target.closest && e.target.closest("a")) e.preventDefault(); }, true);
  el0.addEventListener("submit", e => e.preventDefault(), true);
  host.appendChild(el0);
  // restore inner scroll positions (e.g. the strip of places scrolled to the current one) once laid out
  const restore = () => root.querySelectorAll("[data-atlas-sl],[data-atlas-st]").forEach(n => { n.scrollLeft = +n.getAttribute("data-atlas-sl") || 0; n.scrollTop = +n.getAttribute("data-atlas-st") || 0; });
  requestAnimationFrame(() => { restore(); requestAnimationFrame(restore); });
  return el0;
}

/* ---------- posters: a picture of every state, shown instantly and when live frames are unavailable ---------- */
const posterOf = f => f.kind === "img" ? f.src : f.poster;
function posterStyle(f) { const p = posterOf(f); return p ? `style="background:var(--frame-bg) url('${p}') 0 0/100% auto no-repeat"` : ""; }
function setPoster(box, f) { const p = posterOf(f); if (p) { box.style.background = `var(--frame-bg) url('${p}') 0 0/100% auto no-repeat`; } }

/* ---------- layout ---------- */
const GAP = 64, ROW_MAX = 5600, CAP_H = 1800, TITLE_PAD = 130;
const frameBox = f => ({ w: f.width, h: Math.min(f.height, CAP_H), scrolls: f.height > CAP_H });
const world = $("#world"), stage = $("#stage");
const items = []; // {f, node, box, x, y, w, h}
const sections = []; // {page, x, y, w, h}
let cursorY = 0;

function buildFlows() {
  // Flows page: each flow is a row of thumbnails joined by labelled arrows.
  const sec = el("section", { class: "sec", "data-page": "Flows" });
  sec.style.left = "0px"; sec.style.top = (cursorY + TITLE_PAD) + "px";
  sec.appendChild(el("h2", {}, `Flows<small>${FLOWS.length} journeys</small>`));
  sec.appendChild(el("p", { class: "lede" }, "How a player moves between states. Each arrow is a real action in the app."));
  const TH = 0.4; let y = 40; let maxW = 0;
  FLOWS.forEach(fl => {
    if (fl.graph) { // a sitemap: nodes on a grid, edges between them
      const CW = 330, CH = 470, NW = 0.34;
      const rows = fl.graph.nodes.map(n => n.row), r0 = Math.min(...rows);
      sec.appendChild(el("div", { style: `position:absolute;left:0;top:${y}px;font:600 18px var(--sans);white-space:nowrap` }, esc(fl.title) + `<span style="font:400 13px var(--mono);color:var(--muted);margin-left:10px">${esc(fl.note || "")}</span>`));
      y += 36;
      const svg = svgEl("svg", { class: "flow-svg" }); sec.appendChild(svg);
      const P = {}; let gw = 0, gh = 0;
      fl.graph.nodes.forEach(n => {
        const f = byId.get(n.frame); if (!f) return;
        const w = Math.round(f.width * NW), h = Math.round(Math.min(f.height, 900) * NW);
        const x = n.col * CW, yy = y + (n.row - r0) * CH;
        const node = el("div", { class: "flow-node", "data-id": f.id }); node.style.cssText = `left:${x}px;top:${yy}px;width:${w}px;height:${h}px`;
        const box = el("div", { class: "box" }); setPoster(box, f); node.appendChild(box); node.appendChild(el("div", { class: "cap" }, esc(n.label || f.title)));
        sec.appendChild(node);
        items.push({ f, node, box, scale: NW, w: f.width, h: Math.min(f.height, 900), kind: "flow" });
        P[n.frame] = { x, y: yy, w, h }; gw = Math.max(gw, x + w); gh = Math.max(gh, yy + h);
      });
      fl.graph.edges.forEach(e => {
        const a = P[e.from], b = P[e.to]; if (!a || !b) return;
        const ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
        const dx = bc.x - ac.x, dy = bc.y - ac.y, horiz = Math.abs(dx) >= Math.abs(dy) * 0.9;
        let x1, y1, x2, y2, c1, c2;
        if (horiz) { const s = dx >= 0 ? 1 : -1; x1 = a.x + (s > 0 ? a.w : 0); y1 = Math.min(a.y + a.h - 20, ac.y); x2 = b.x + (s > 0 ? 0 : b.w); y2 = Math.min(b.y + b.h - 20, bc.y); c1 = [x1 + s * 70, y1]; c2 = [x2 - s * 70, y2]; }
        else { const s = dy >= 0 ? 1 : -1; x1 = ac.x; y1 = a.y + (s > 0 ? a.h : 0); x2 = bc.x; y2 = b.y + (s > 0 ? 0 : b.h); c1 = [x1, y1 + s * 70]; c2 = [x2, y2 - s * 70]; }
        const p = svgEl("path"); p.setAttribute("d", `M${x1},${y1} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${x2},${y2}`); svg.appendChild(p);
        const ang = Math.atan2(y2 - c2[1], x2 - c2[0]), hx = x2 - Math.cos(ang) * 4, hy = y2 - Math.sin(ang) * 4;
        const head = svgEl("path"); head.setAttribute("d", `M${hx - Math.cos(ang - 0.45) * 12},${hy - Math.sin(ang - 0.45) * 12} L${x2},${y2} L${hx - Math.cos(ang + 0.45) * 12},${hy - Math.sin(ang + 0.45) * 12}`); svg.appendChild(head);
        if (e.label) { const t = svgEl("text"); t.setAttribute("x", (x1 + x2) / 2); t.setAttribute("y", (y1 + y2) / 2 - 8); t.setAttribute("text-anchor", "middle"); t.textContent = e.label; svg.appendChild(t); }
      });
      svg.setAttribute("width", gw); svg.setAttribute("height", gh + 40);
      maxW = Math.max(maxW, gw); y = gh + 100;
      return;
    }
    const steps = fl.steps.map(s => ({ ...s, f: byId.get(s.frame) })).filter(s => s.f);
    if (!steps.length) return;
    const title = el("div", { style: `position:absolute;left:0;top:${y}px;font:600 18px var(--sans);white-space:nowrap` }, esc(fl.title) + `<span style="font:400 13px var(--mono);color:var(--muted);margin-left:10px">${esc(fl.note || "")}</span>`);
    sec.appendChild(title);
    y += 36;
    let x = 0, rowH = 0; const svg = svgEl("svg", { class: "flow-svg", width: 1, height: 1 }); sec.appendChild(svg);
    const pos = {};
    steps.forEach((s, i) => {
      const w = Math.round(s.f.width * TH), h = Math.round(Math.min(s.f.height, 1100) * TH);
      const n = el("div", { class: "flow-node", "data-id": s.f.id }); n.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
      const box = el("div", { class: "box" }); setPoster(box, s.f); n.appendChild(box); n.appendChild(el("div", { class: "cap" }, esc(s.f.title)));
      sec.appendChild(n);
      items.push({ f: s.f, node: n, box, scale: TH, w: s.f.width, h: Math.min(s.f.height, 1100), kind: "flow" });
      pos[i] = { x, y, w, h };
      x += w + 150; rowH = Math.max(rowH, h);
    });
    // arrows between consecutive nodes (+ explicit branches)
    const arrow = (a, b, label) => {
      const x1 = a.x + a.w, y1 = a.y + Math.min(a.h, 120), x2 = b.x, y2 = b.y + Math.min(b.h, 120);
      const mx = (x1 + x2) / 2;
      const p = svgEl("path"); p.setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 6},${y2}`); svg.appendChild(p);
      const head = svgEl("path"); head.setAttribute("d", `M${x2 - 12},${y2 - 6} L${x2 - 2},${y2} L${x2 - 12},${y2 + 6}`); svg.appendChild(head);
      if (label) { const t = svgEl("text"); t.setAttribute("x", mx); t.setAttribute("y", Math.min(y1, y2) - 8); t.setAttribute("text-anchor", "middle"); t.textContent = label; svg.appendChild(t); }
    };
    steps.forEach((s, i) => { if (i > 0 && s.label !== null) arrow(pos[i - 1], pos[i], s.label); });
    svg.setAttribute("width", x); svg.setAttribute("height", y + rowH + 40);
    maxW = Math.max(maxW, x);
    y += rowH + 80;
  });
  sec.style.width = maxW + "px"; sec.style.height = y + "px";
  world.appendChild(sec);
  sections.push({ page: "Flows", x: 0, y: cursorY + TITLE_PAD, w: maxW, h: y, sec });
  cursorY += TITLE_PAD + y + 140;
}

function buildPage(pageName, list, lede) {
  const sec = el("section", { class: "sec", "data-page": pageName });
  sec.style.left = "0px"; sec.style.top = (cursorY + TITLE_PAD) + "px";
  sec.appendChild(el("h2", {}, `${esc(pageName)}<small>${list.length} ${list.length === 1 ? "state" : "states"}</small>`));
  if (lede) sec.appendChild(el("p", { class: "lede" }, esc(lede)));
  let x = 0, y = 40, rowH = 0, maxX = 0;
  list.forEach(f => {
    const b = frameBox(f);
    if (x > 0 && x + b.w > ROW_MAX) { x = 0; y += rowH + 90; rowH = 0; }
    const n = el("div", { class: "fr", "data-id": f.id });
    n.style.cssText = `left:${x}px;top:${y}px;width:${b.w}px;height:${b.h}px`;
    n.innerHTML = `<div class="cap"><b>${esc(f.title)}</b><span>${f.kind === "video" ? "▶ " : ""}${f.width}×${f.height}</span></div><div class="box ${f.poster || f.kind === "img" ? "" : "ph"}" data-label="${esc(f.title)}" ${posterStyle(f)}></div>${b.scrolls ? '<div class="scrolls">scrolls ↕</div>' : ""}`;
    n.querySelector(".cap").insertAdjacentHTML("beforeend", `<button class="insp" aria-label="Inspect ${esc(f.title)}" title="Inspect">⤢</button>`);
    sec.appendChild(n);
    items.push({ f, node: n, box: n.querySelector(".box"), scale: 1, w: f.width, h: b.h, kind: "frame" });
    x += b.w + GAP; rowH = Math.max(rowH, b.h); maxX = Math.max(maxX, x - GAP);
  });
  sec.style.width = maxX + "px"; sec.style.height = (y + rowH) + "px";
  world.appendChild(sec);
  sections.push({ page: pageName, x: 0, y: cursorY + TITLE_PAD, w: maxX, h: y + rowH, sec });
  cursorY += TITLE_PAD + y + rowH + 160;
}

const framesBy = p => FRAMES.filter(f => f.page === p);
PAGES.forEach(g => g.pages.forEach(p => {
  if (p.name === "Flows") buildFlows();
  else { const l = framesBy(p.name); if (l.length) buildPage(p.name, l, p.lede); }
}));

/* ---------- rail ---------- */
const rail = $("#rail");
PAGES.forEach(g => {
  rail.appendChild(el("h3", {}, esc(g.group)));
  g.pages.forEach(p => {
    const n = p.name === "Flows" ? FLOWS.length : framesBy(p.name).length;
    if (!n) return;
    const a = el("a", { href: "#" + p.name.replace(/\W+/g, "-"), "data-page": p.name }, `<span>${esc(p.name)}</span><small>${n}</small>`);
    a.addEventListener("click", ev => { ev.preventDefault(); document.body.classList.remove("rail-open"); goTo(p.name); });
    rail.appendChild(a);
  });
});

/* ---------- pan / zoom ---------- */
let tx = 24, ty = 24, z = 0.5;
const ZMIN = 0.06, ZMAX = 2;
function apply() {
  world.style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
  $("#zVal").textContent = Math.round(z * 100) + "%";
  queueLazy();
}
function zoomAt(nz, cx, cy) {
  nz = Math.min(ZMAX, Math.max(ZMIN, nz));
  tx = cx - (cx - tx) * (nz / z); ty = cy - (cy - ty) * (nz / z); z = nz; apply();
}
function stageRect() { return stage.getBoundingClientRect(); }
function goTo(name) {
  const s = sections.find(x => x.page === name); if (!s) return;
  const r = stageRect();
  const nz = Math.min(0.6, Math.max(ZMIN, Math.min((r.width - 80) / Math.max(s.w, 1), (r.height - 160) / Math.max(s.h + 100, 1))) );
  z = Math.max(0.4, nz); tx = 40 - s.x * z; ty = 110 - (s.y) * z; apply();
  rail.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.page === name));
}
function fit() {
  const r = stageRect(); const W = Math.max(...sections.map(s => s.w)) + 80, H = cursorY;
  z = Math.max(ZMIN, Math.min(r.width / W, r.height / H)); tx = 20; ty = 20; apply();
}
let drag = null;
stage.addEventListener("pointerdown", e => { if (e.target.closest(".fr") && !e.target.closest(".insp")) { drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false, hit: e.target.closest(".fr"), id: e.pointerId }; } else { drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false, id: e.pointerId }; } stage.classList.add("drag"); stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true; if (drag.moved) { tx = drag.tx + dx; ty = drag.ty + dy; apply(); } });
const endDrag = e => { if (!drag) return; stage.classList.remove("drag"); if (!drag.moved && drag.hit) inspect(drag.hit.dataset.id); drag = null; };
stage.addEventListener("pointerup", endDrag); stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stageRect(); if (e.ctrlKey || e.metaKey) zoomAt(z * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top); else { tx -= e.deltaX; ty -= e.deltaY; apply(); } }, { passive: false });
// two-finger pinch
const touches = new Map(); let pinch0 = null;
stage.addEventListener("touchstart", e => { if (e.touches.length === 2) { pinch0 = { d: dist(e.touches), z }; } }, { passive: true });
stage.addEventListener("touchmove", e => { if (e.touches.length === 2 && pinch0) { const r = stageRect(); const m = mid(e.touches); zoomAt(pinch0.z * dist(e.touches) / pinch0.d, m.x - r.left, m.y - r.top); } }, { passive: true });
stage.addEventListener("touchend", () => { pinch0 = null; }, { passive: true });
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
const mid = t => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });
stage.addEventListener("keydown", e => {
  const s = 80; const r = stageRect();
  if (e.key === "ArrowLeft") tx += s; else if (e.key === "ArrowRight") tx -= s; else if (e.key === "ArrowUp") ty += s; else if (e.key === "ArrowDown") ty -= s;
  else if (e.key === "+" || e.key === "=") zoomAt(z * 1.2, r.width / 2, r.height / 2); else if (e.key === "-") zoomAt(z / 1.2, r.width / 2, r.height / 2); else if (e.key === "0") fit(); else return;
  e.preventDefault(); apply();
});
$("#zIn").onclick = () => { const r = stageRect(); zoomAt(z * 1.25, r.width / 2, r.height / 2); };
$("#zOut").onclick = () => { const r = stageRect(); zoomAt(z / 1.25, r.width / 2, r.height / 2); };
$("#zFit").onclick = fit;
$("#railToggle").onclick = () => document.body.classList.toggle("rail-open");

/* ---------- lazy frames: only what is near the viewport is mounted ---------- */
let lazyQ = false;
function queueLazy() { if (lazyQ) return; lazyQ = true; requestAnimationFrame(() => { lazyQ = false; lazy(); }); }
function lazy() {
  if (document.body.classList.contains("gal")) return;
  const r = stageRect(); const pad = 500;
  for (const it of items) {
    const rect = it.node.getBoundingClientRect();
    const near = rect.right > r.left - pad && rect.left < r.right + pad && rect.bottom > r.top - pad && rect.top < r.bottom + pad;
    const media = it.f.kind === "img" || it.f.kind === "video";
    const big = media ? rect.width > 40 : rect.width > 56; // a speck stays a poster
    if (near && big) { if (!it.ifr) { it.box.classList.remove("ph"); it.ifr = mountFrame(it.box, it.f, it.scale, it.w, it.h); } }
    else if (it.ifr && !near) { it.ifr.remove(); it.ifr = null; }
  }
}

/* ---------- filter ---------- */
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  for (const it of items) { if (it.kind !== "frame") continue; const hay = (it.f.title + " " + it.f.page + " " + (it.f.note || "")).toLowerCase(); it.node.classList.toggle("dim", !!q && !hay.includes(q)); }
});

/* ---------- inspector ---------- */
const panel = $("#panel");
let currentId = null;
function inspect(id) {
  const f = byId.get(id); if (!f) return; currentId = id;
  items.forEach(it => it.node.classList.toggle("sel", it.f.id === id && it.kind === "frame"));
  const list = FRAMES.filter(x => x.page === f.page); const i = list.indexOf(f);
  panel.hidden = false;
  panel.innerHTML = `<header><div><h2>${esc(f.title)}</h2><small>${esc(f.page)} · ${i + 1} of ${list.length}</small></div><div class="hb"><button id="pFig" title="Copy this screen as editable layers, then paste into Figma (⌘C)">Copy for Figma</button><button id="pClose" aria-label="Close">✕</button></div></header>
  <div class="body"><div class="view" id="pView"></div>
  <dl><dt>What it shows</dt><dd>${esc(f.note || "—")}</dd><dt>Viewport</dt><dd>${f.vp === "d" ? "Desktop" : "Phone"} · ${f.width}px wide, ${f.height}px tall</dd>${f.route && f.route[0] === "#" ? `<dt>Route</dt><dd><code>${esc(f.route)}</code></dd>` : ""}${f.recipe ? `<dt>State</dt><dd>${esc(f.recipe)}</dd>` : ""}</dl></div>
  <footer><button id="pPrev">← Previous</button><button id="pNext">Next →</button></footer>`;
  const view = $("#pView"); const avail = Math.min(408, panel.clientWidth - 30); const sc = Math.min(1, avail / f.width);
  view.style.width = (f.width * sc) + "px";
  const holder = el("div", { style: `width:${f.width * sc}px;height:${Math.min(f.height, 4000) * sc}px;overflow:hidden` }); view.appendChild(holder);
  mountFrame(holder, f, sc, f.width, Math.min(f.height, 4000)); const vv = holder.querySelector("video"); if (vv) vv.controls = true; // play, pause and scrub in the inspector
  $("#pFig").onclick = () => copyForFigma(id);
  $("#pClose").onclick = () => { panel.hidden = true; items.forEach(it => it.node.classList.remove("sel")); };
  $("#pPrev").onclick = () => inspect(list[(i - 1 + list.length) % list.length].id);
  $("#pNext").onclick = () => inspect(list[(i + 1) % list.length].id);
}
/*__FIGMA__*/
function toast(msg, bad) {
  let t = $("#toast"); if (!t) { t = el("div", { id: "toast", role: "status" }); document.body.appendChild(t); }
  t.textContent = msg; t.className = "show" + (bad ? " bad" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ""; }, 4500);
}
async function writeClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try { const ta = el("textarea", { style: "position:fixed;left:-9999px;top:0" }); ta.value = text; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch (e) { return false; }
}
function copyDialog(svg, f) { // the browser blocked clipboard access: let the person copy it themselves
  const d = el("div", { id: "cdlg" });
  d.innerHTML = `<div class="card"><h3>Copy for Figma</h3><p>The browser did not allow automatic copying. Select all (⌘A / Ctrl+A), copy (⌘C / Ctrl+C), then paste into Figma (⌘V / Ctrl+V).</p><textarea readonly></textarea><div class="row"><button class="dl">Download .svg</button><button class="x">Close</button></div></div>`;
  const ta = d.querySelector("textarea"); ta.value = svg;
  d.querySelector(".x").onclick = () => d.remove();
  d.querySelector(".dl").onclick = () => { const a = el("a", { href: URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" })), download: (f.id || "frame") + ".svg" }); document.body.appendChild(a); a.click(); a.remove(); };
  document.body.appendChild(d); ta.focus(); ta.select();
}
let copying = false;
async function copyForFigma(id) {
  const f = byId.get(id || currentId); if (!f || copying) return; copying = true;
  toast("Preparing “" + f.title + "” for Figma…");
  try {
    const res = await frameToSvg(f);
    if (await writeClipboard(res.svg)) toast(`Copied “${f.title}” (${res.layers} layers). In Figma press ⌘V / Ctrl+V.${res.fonts.length ? " Fonts: " + res.fonts.join(", ") + "." : ""}`);
    else { document.querySelector("#toast")?.classList.remove("show"); copyDialog(res.svg, f); }
  } catch (e) { toast("Could not export this frame: " + e.message, true); }
  copying = false;
}
window.atlasFigmaSvg = id => frameToSvg(byId.get(id));
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "c" && currentId && !panel.hidden && !String(getSelection()) && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName)) { e.preventDefault(); copyForFigma(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden) { panel.hidden = true; items.forEach(it => it.node.classList.remove("sel")); } });
world.addEventListener("click", e => { const n = e.target.closest(".flow-node"); if (n) { inspect(n.dataset.id); return; } const b = e.target.closest(".insp"); if (b) inspect(b.closest(".fr").dataset.id); });

/* ---------- gallery view (phones, or by choice) ---------- */
const gal = $("#gallery"); let galBuilt = false;
function buildGallery() {
  if (galBuilt) return; galBuilt = true;
  PAGES.forEach(g => g.pages.forEach(p => {
    const list = p.name === "Flows" ? [] : framesBy(p.name); if (!list.length) return;
    const sec = el("section", {}, `<h2>${esc(p.name)}</h2><p>${esc(p.lede || "")}</p>`);
    const strip = el("div", { class: "strip" });
    list.forEach(f => {
      const sc = Math.min(1, 300 / f.width), w = Math.round(f.width * sc), h = Math.round(Math.min(f.height, 900) * sc);
      const gf = el("div", { class: "gf", style: `width:${w}px`, tabindex: "0", role: "button", "aria-label": "Inspect " + f.title });
      const box = el("div", { class: "box", style: `width:${w}px;height:${h}px` }); setPoster(box, f);
      gf.appendChild(box); gf.appendChild(el("div", { class: "t" }, esc(f.title)));
      gf.onclick = () => inspect(f.id); gf.onkeydown = e => { if (e.key === "Enter") inspect(f.id); };
      strip.appendChild(gf);
      const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting && !box.firstChild) mountFrame(box, f, sc, f.width, Math.min(f.height, 900)); }), { root: null, rootMargin: "600px" });
      io.observe(box);
    });
    sec.appendChild(strip); gal.appendChild(sec);
  }));
}
function setView(v) {
  const g = v === "gallery";
  document.body.classList.toggle("gal", g);
  $("#vCanvas").setAttribute("aria-pressed", String(!g)); $("#vGallery").setAttribute("aria-pressed", String(g));
  $("#zoomBox").style.display = g ? "none" : "";
  if (g) buildGallery(); else queueLazy();
}
$("#vCanvas").onclick = () => setView("canvas"); $("#vGallery").onclick = () => setView("gallery");

new ResizeObserver(queueLazy).observe(stage);
const narrow = matchMedia("(max-width:760px)").matches;
if (narrow) setView("gallery"); else { goTo(sections[0] ? sections[0].page : "Flows"); }
})();
</script>
